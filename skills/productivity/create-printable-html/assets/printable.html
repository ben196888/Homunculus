<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    /* Update these screen values AND the literal @page rule for other sizes. */
    :root {
      --paper-width: 210mm;
      --paper-height: 297mm;
      --margin-block: 10mm;
      --margin-inline: 13mm;
      font-family: Arial, "Noto Sans", "DejaVu Sans", sans-serif;
      font-size: 10.5pt;
      line-height: 1.45;
      color: #171717;
    }
    @page { size: A4 portrait; margin: 10mm 13mm; }
    * { box-sizing: border-box; }
    :lang(zh-Hant) {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      line-break: auto;
      word-break: normal;
    }
    :lang(en), :lang(vi) {
      font-family: Arial, "Noto Sans", "DejaVu Sans", sans-serif;
    }
    body { margin: 0; }
    h1 { font-size: 18pt; line-height: 1.25; margin: 0 0 6mm; }
    h2 { font-size: 12pt; margin: 5mm 0 2mm; }
    h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
    p { margin: 0 0 3mm; orphans: 3; widows: 3; }
    address { font-style: normal; }
    .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3mm; margin-block: 4mm; }
    .info-card { min-width: 0; border-block-start: 0.25mm solid #aaa; padding-block: 2mm; }
    .keep-together, .info-card, .signature { break-inside: avoid; page-break-inside: avoid; }
    .allow-break { break-inside: auto; page-break-inside: auto; }
    .wrap-token { overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; margin-block: 4mm; }
    thead { display: table-header-group; }
    th, td { text-align: start; vertical-align: top; padding: 2mm; border-block-end: 0.2mm solid #bbb; }
    tr { break-inside: avoid; page-break-inside: avoid; }
    img, svg { max-width: 100%; height: auto; }
    .signature { margin-block-start: 8mm; }
    .signature-line { display: inline-block; width: 55mm; max-width: 100%; height: 12mm; border-block-end: 0.25mm solid currentColor; vertical-align: bottom; }
    @media screen {
      body { background: #e9e9e9; padding: 8mm; }
      .page {
        width: var(--paper-width);
        min-height: var(--paper-height);
        margin: 0 auto;
        padding: var(--margin-block) var(--margin-inline);
        background: white;
        box-shadow: 0 1mm 5mm rgb(0 0 0 / 15%);
      }
    }
    @media print {
      html, body { margin: 0; padding: 0; background: white; }
      .page { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
      .exact-color { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <!-- Replace this sample content and adapt its structure to the document. -->
  <main class="page">
    <header><h1>Document title</h1></header>
    <p>Document content.</p>
  </main>
</body>
</html>
