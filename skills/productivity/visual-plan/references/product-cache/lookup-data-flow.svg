<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="lookup-data-flow-title lookup-data-flow-desc">
<title id="lookup-data-flow-title">Product lookup: data-flow impact</title>
<desc id="lookup-data-flow-desc">Current requests always read the repository; proposed requests return a fresh cached product or read the repository and fill the cache, preserving 404 for missing products.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526176"/></marker></defs>
<rect width="1120" height="1120" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="44" y="52" font-size="29" font-weight="bold">Product lookup: data-flow impact</text>
<text x="44" y="106" font-size="20" font-weight="bold">CURRENT — every lookup reads the repository</text>
<rect x="44" y="146" width="252" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="58" y="172" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="58" y="202" font-size="20" font-weight="bold">Request</text>
<text x="58" y="227" font-size="14" font-weight="normal">product_id via API</text>
<rect x="428" y="146" width="252" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="442" y="172" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="442" y="202" font-size="20" font-weight="bold">Product service</text>
<text x="442" y="227" font-size="14" font-weight="normal">Forward product_id</text>
<rect x="812" y="146" width="264" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="826" y="172" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="826" y="202" font-size="20" font-weight="bold">Repository read</text>
<text x="826" y="227" font-size="14" font-weight="normal">Product or LookupError</text>
<path d="M296,206 L428,206" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324.0" y="174" width="76.0" height="20" fill="white"/>
<text x="362.0" y="190" text-anchor="middle" font-size="13">PRODUCT ID</text>
<path d="M680,206 L812,206" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730.8" y="174" width="30.4" height="20" fill="white"/>
<text x="746.0" y="190" text-anchor="middle" font-size="13">READ</text>
<text x="44" y="304" font-size="17" font-weight="normal">Existing API returns 200 + product, or 404 + the unchanged error payload.</text>
<text x="44" y="394" font-size="20" font-weight="bold">PROPOSED — service routing added in step 2</text>
<rect x="44" y="442" width="240" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="58" y="468" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="58" y="498" font-size="20" font-weight="bold">Request</text>
<text x="58" y="523" font-size="14" font-weight="normal">product_id via API</text>
<rect x="428" y="442" width="260" height="120" rx="8" fill="#fff1cb" stroke="#526176" stroke-width="1.4"/>
<text x="442" y="468" font-size="12" font-weight="bold">CHANGED</text>
<text x="442" y="498" font-size="20" font-weight="bold">Cache lookup</text>
<text x="442" y="523" font-size="14" font-weight="normal">Product service → cache</text>
<text x="442" y="543" font-size="14" font-weight="normal">Fresh while now &lt; expires_at</text>
<rect x="812" y="442" width="264" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="826" y="468" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="826" y="498" font-size="20" font-weight="bold">Return HTTP 200</text>
<text x="826" y="523" font-size="14" font-weight="normal">Cached product; no DB read</text>
<path d="M284,502 L428,502" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="318.0" y="470" width="76.0" height="20" fill="white"/>
<text x="356.0" y="486" text-anchor="middle" font-size="13">PRODUCT ID</text>
<path d="M688,502 L812,502" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="738.6" y="470" width="22.799999999999997" height="20" fill="white"/>
<text x="750.0" y="486" text-anchor="middle" font-size="13">HIT</text>
<rect x="428" y="690" width="260" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="442" y="716" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="442" y="746" font-size="20" font-weight="bold">Repository read</text>
<text x="442" y="771" font-size="14" font-weight="normal">Existing get_product method</text>
<path d="M558,562 L558,690" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<text x="572" y="626.0" font-size="13" font-weight="normal">MISS / EXPIRED</text>
<rect x="44" y="690" width="240" height="120" rx="8" fill="#f3f5f8" stroke="#526176" stroke-width="1.4"/>
<text x="58" y="716" font-size="12" font-weight="bold">UNCHANGED</text>
<text x="58" y="746" font-size="20" font-weight="bold">Return HTTP 404</text>
<text x="58" y="771" font-size="14" font-weight="normal">Existing error payload</text>
<text x="58" y="791" font-size="14" font-weight="normal">Do not cache this failure</text>
<path d="M428,750 L284,750" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="321.8" y="718" width="68.39999999999999" height="20" fill="white"/>
<text x="356.0" y="734" text-anchor="middle" font-size="13">NOT FOUND</text>
<rect x="428" y="922" width="360" height="120" rx="8" fill="#fff1cb" stroke="#526176" stroke-width="1.4"/>
<text x="442" y="948" font-size="12" font-weight="bold">CHANGED</text>
<text x="442" y="978" font-size="20" font-weight="bold">Cache fill + HTTP 200</text>
<text x="442" y="1003" font-size="14" font-weight="normal">Step 1: TTL 60s; max 128 entries</text>
<text x="442" y="1023" font-size="14" font-weight="normal">Step 2: cache successful result</text>
<path d="M558,810 L558,922" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<text x="572" y="866.0" font-size="13" font-weight="normal">PRODUCT</text>
<text x="44" y="1082" font-size="14" font-weight="normal">CHANGED: cache routing and fill. UNCHANGED: request, repository and HTTP contracts.</text>
</g></svg>